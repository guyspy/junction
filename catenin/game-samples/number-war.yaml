meta:
  name: "數字戰爭"
  target_age: [6, 10]
  player_count: [2, 4]

cards:
  number_card:
    count: 20
    properties:
      value:
        type: int
        min: 1
        max: 10
      color:
        type: enum
        values: [red, blue, green, yellow]
    events:
      on_play:
        action: "add_score"
        target: "self"
        amount: "{value}"

mechanics:
  setup:
    players:
      health: 100
      hand_size: 7
      initial_score: 0
  
  win_conditions:
    - type: "score_target"
      target: 50
      message: "{winner} 達到50分獲勝！"
    - type: "max_turns"
      max_turns: 20
      message: "遊戲結束！分數最高者獲勝！"

ai_hints:
  difficulty_factors:
    - "cards.number_card.properties.value.max"
    - "mechanics.setup.win_conditions.score_target.target"
  common_modifications:
    easier:
      value_max: 8
      score_target: 40
    harder:
      value_max: 12
      score_target: 60