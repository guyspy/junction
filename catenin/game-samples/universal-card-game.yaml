# Universal Card Game Example
# Shows how to define a card game using the universal object system

meta:
  name: "Universal Card Game"
  target_age: [8, 12]
  participant_count: [2, 4]

# Object type definitions - templates for creating instances
object_types:
  # Player object type (optional - represents in-game player character/avatar)
  player:
    properties:
      health: {type: INT, initial: 20, min: 0}
      mana: {type: INT, initial: 0, min: 0, max: 10}
      name: {type: STRING}
      participant_id: {type: INT}  # Links to abstract participant/seat
    states:
      active: {type: BOOL, initial: false}

  # Generic container object type (replaces "zone")
  container:
    properties:
      name: {type: STRING}
      owner: {type: STRING}
      max_size: {type: INT, initial: -1}  # -1 = unlimited
      visibility: {type: STRING, initial: "public"}  # public, hidden, owner

  # Card object type  
  card:
    properties:
      name: {type: STRING}
      cost: {type: INT, min: 0}
      attack: {type: INT, min: 0}
      defense: {type: INT, min: 0}
      text: {type: STRING}
    states:
      tapped: {type: BOOL, initial: false}
      face_up: {type: BOOL, initial: true}

# Predefined object instances
instances:
  # Some example cards
  lightning_bolt:
    template: card
    properties:
      name: "Lightning Bolt"
      cost: 1
      attack: 3
      defense: 0
      text: "Deal 3 damage to target"
      
  healing_potion:
    template: card
    properties:
      name: "Healing Potion"
      cost: 2
      attack: 0
      defense: 0
      text: "Restore 5 health"

  giant_spider:
    template: card
    properties:
      name: "Giant Spider"
      cost: 3
      attack: 2
      defense: 4
      text: "A fearsome creature"

# Generic initialization system - no hardcoded game concepts
setup:
  # Server startup - create initial world state
  world_initialization:
    - create_objects:
        count: 1
        template: "container"
        properties:
          name: "battlefield"
          visibility: "public"
    
    - create_objects:
        count: 1  
        template: "container"
        properties:
          name: "graveyard"
          visibility: "public"

  # Per-participant setup - happens when each participant joins
  participant_initialization:
    - create_objects:
        count: 1
        template: "container"
        properties:
          name: "deck_{participant_id}"
          owner: "{participant_id}"
          visibility: "owner"
    
    - create_objects:
        count: 1
        template: "container"
        properties:
          name: "hand_{participant_id}"
          owner: "{participant_id}"
          visibility: "owner"
    
    - create_objects:
        count: 3
        template: "card"
        instance_source: "lightning_bolt"
        parent: "deck_{participant_id}"
    
    - create_objects:
        count: 2
        template: "card"
        instance_source: "healing_potion"
        parent: "deck_{participant_id}"
    
    - create_objects:
        count: 1
        template: "card"
        instance_source: "giant_spider"
        parent: "deck_{participant_id}"

# Generic runtime spawning - property-driven creation
runtime_spawning:
  - name: "spawn_from_template"
    when:
      property_changed: "spawn_requested"
      new_value: "true"
    effects:
      - create_object:
          template: "{this.properties.requested_template}"
          parent: "{this.properties.target_parent}"
          properties:
            created_by: "{this.properties.participant_id}"

# Universal trigger system
triggers:
  # When a card is played (moved to battlefield container)
  - name: "card_enters_battlefield"
    when:
      object_type: card
      property_changed: parent
      new_value_matches: {name: "battlefield"}
    effects:
      - log: "{this.name} enters the battlefield"
      
  # Lightning Bolt effect
  - name: "lightning_bolt_effect"
    when:
      object_type: card
      property_changed: parent
      new_value_matches: {name: "battlefield"}
      condition: "this.properties.name == 'Lightning Bolt'"
    effects:
      - modify_property:
          target: {type: player, relation: opponent}
          property: "health"
          delta: "-3"
      - change_parent:
          target: {id: "this"}
          new_parent: {type: container, property_match: {name: "graveyard"}}
          
  # Healing Potion effect
  - name: "healing_potion_effect"
    when:
      object_type: card
      property_changed: parent
      new_value_matches: {name: "battlefield"}
      condition: "this.properties.name == 'Healing Potion'"
    effects:
      - modify_property:
          target: {type: player, relation: self}
          property: "health"
          delta: "+5"
      - change_parent:
          target: {id: "this"}
          new_parent: {type: container, property_match: {name: "graveyard"}}
          
  # Player death trigger
  - name: "player_death"
    when:
      object_type: player
      property_changed: "properties.health"
      new_value: 0
    effects:
      - log: "{this.name} has been defeated!"