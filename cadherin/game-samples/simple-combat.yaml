meta:
  name: "簡單戰鬥"
  target_age: [8, 12]
  player_count: [2, 2]

cards:
  attack_card:
    count: 15
    properties:
      damage:
        type: int
        min: 1
        max: 5
      element:
        type: enum
        values: [fire, water, earth]
    events:
      on_play:
        action: "deal_damage"
        target: "opponent"
        amount: "{damage}"
  
  heal_card:
    count: 5
    properties:
      healing:
        type: int
        min: 2
        max: 4
    events:
      on_play:
        action: "restore_health"
        target: "self"
        amount: "{healing}"

mechanics:
  setup:
    players:
      health: 15
      hand_size: 5
  
  win_conditions:
    - type: "health_depleted"
      message: "{winner} 獲勝！"

ai_hints:
  difficulty_factors: 
    - "cards.attack_card.properties.damage.max"
    - "mechanics.setup.players.health"
  common_modifications:
    easier:
      damage_max: 3
      health: 20
    harder:
      damage_max: 7
      health: 10